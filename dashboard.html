<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب المستخدم - MOBET LINK</title><link rel="stylesheet" href="/style.css"></head><body><header class="wrap top"><a class="brand" href="/">MOBET <span>LINK</span></a><nav class="nav"><button class="btn2" id="logout">تسجيل خروج</button></nav></header><main class="wrap">
<div id="auth" class="auth panel"><h1>حساب MOBET LINK</h1><div class="tabs"><button id="loginTab">دخول</button><button class="btn2" id="registerTab">حساب جديد</button></div><form id="authForm" class="stack" style="margin-top:18px"><input class="field" id="email" type="email" placeholder="البريد الإلكتروني" required><input class="field" id="password" type="password" minlength="8" placeholder="كلمة المرور (8 أحرف على الأقل)" required><button id="authSubmit">دخول</button></form><p id="authMsg" class="muted"></p></div>
<div id="app" class="hidden"><h1>لوحة المستخدم</h1><p class="muted" id="welcome"></p><div class="grid"><div class="stat"><b id="balance">$0.00</b><span>الرصيد المتاح</span></div><div class="stat"><b id="clicks">0</b><span>إجمالي النقرات</span></div><div class="stat"><b id="total">0</b><span>روابطي المختصرة</span></div></div>
<section class="panel section"><h2>اختصر رابطًا جديدًا</h2><form id="create" class="stack"><input class="field" id="destination" type="url" placeholder="الرابط الأصلي https://..." required><div class="formgrid"><input class="field" id="title" placeholder="اسم الرابط (اختياري)"><input class="field" id="custom" placeholder="كلمة مخصصة (اختياري)"><input class="field" id="expires" type="datetime-local" aria-label="تاريخ الانتهاء (اختياري)"></div><button>إنشاء الرابط المختصر</button></form><p id="createMsg"></p><div id="created" class="hidden notice copyrow"><input class="field" id="newLink" readonly><button class="btn2" id="copy">نسخ</button></div></section>
<section class="panel section"><h2>روابطي</h2><div class="tablewrap"><table><thead><tr><th>الرابط المختصر</th><th>الوجهة</th><th>النقرات</th><th>الانتهاء</th></tr></thead><tbody id="links"></tbody></table></div></section>
<section class="panel section"><h2>طلب سحب الأرباح</h2><p class="muted">أدخل المبلغ وطريقة السحب. الطلب يظل قيد المراجعة حتى يعتمد الأدمن الدفع.</p><form id="payout" class="stack"><div class="formgrid"><input class="field" id="amount" type="number" min="1" step=".01" placeholder="المبلغ" required><select class="field" id="method"><option>محفظة إلكترونية</option><option>تحويل بنكي</option><option>وسيلة أخرى</option></select></div><input class="field" id="details" placeholder="بيانات استلام المبلغ" required><button>إرسال طلب السحب</button></form><p id="payoutMsg"></p></section></div></main>
<script>
let mode='login',me=null;const $=id=>document.getElementById(id),api=async(url,opts={})=>{let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'حدث خطأ');return d};
function setMode(m){mode=m;$('authSubmit').textContent=m==='login'?'دخول':'إنشاء حساب';$('loginTab').className=m==='login'?'':'btn2';$('registerTab').className=m==='register'?'':'btn2'}
$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');
$('authForm').onsubmit=async e=>{e.preventDefault();$('authMsg').textContent='جارٍ التنفيذ...';try{await api('/api/'+(mode==='login'?'login':'register'),{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});await load()}catch(x){$('authMsg').textContent=x.message}};
async function load(){try{let d=await api('/api/me');me=d.user;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='مرحبًا '+me.email;await refresh()}catch{$('auth').classList.remove('hidden');$('app').classList.add('hidden')}}
async function refresh(){let [s,l]=await Promise.all([api('/api/stats'),api('/api/links')]);$('balance').textContent='$'+Number(s.balance).toFixed(2);$('clicks').textContent=s.clicks;$('total').textContent=s.total;$('links').innerHTML=l.links.map(x=>`<tr><td><a target="_blank" href="${x.url}">${x.url}</a></td><td>${esc(x.destination)}</td><td>${x.clicks}</td><td>${x.expires_at||'—'}</td></tr>`).join('')||'<tr><td colspan="4">لم تنشئ روابط بعد</td></tr>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('create').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/links',{method:'POST',body:JSON.stringify({destination:$('destination').value,title:$('title').value,custom:$('custom').value,expires_at:$('expires').value?new Date($('expires').value).toISOString():null})});$('newLink').value=d.link.url;$('created').classList.remove('hidden');$('createMsg').textContent='تم إنشاء الرابط';$('createMsg').className='success';e.target.reset();await refresh()}catch(x){$('createMsg').textContent=x.message;$('createMsg').className='error'}};
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('newLink').value);$('copy').textContent='تم النسخ'};
$('payout').onsubmit=async e=>{e.preventDefault();try{await api('/api/payouts',{method:'POST',body:JSON.stringify({amount:$('amount').value,method:$('method').value,details:$('details').value})});$('payoutMsg').textContent='تم إرسال طلب السحب';$('payoutMsg').className='success';e.target.reset();await refresh()}catch(x){$('payoutMsg').textContent=x.message;$('payoutMsg').className='error'}};
$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
setMode('login');load();const q=new URLSearchParams(location.search).get('url');if(q)$('destination').value=q;
</script></body></html>
